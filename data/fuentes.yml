# Registro de fuentes primarias del corpus, para su seguimiento.
#
# Cada fuente dice qué versión cita el corpus, cuándo se revisó por última vez,
# cada cuánto hay que volver a mirarla y cómo se detecta que ha cambiado. Con
# esto, hooks/fuentes.py genera las páginas «Fuentes» (seguimiento, grafo e
# impacto) y scripts/vigilar_fuentes.py hace la revisión periódica.
#
# Campos:
#   id            identificador estable (no se reutiliza)
#   nombre        cómo se cita
#   corto         nombre para el grafo (si falta, el de `nombre` hasta « · »)
#   tipo          acto | arf | etsi | openid | ietf | w3c | iso | av | herramienta
#   citada        versión exacta que cita el corpus (null si está por fijar)
#   url           URL de la versión citada (si falta, la de `ref`)
#   ref           id en el catálogo de documentos referenciados (enlaza fichas)
#   periodicidad  días entre revisiones
#   revisado      fecha de la última revisión contra la fuente (null: nunca)
#   vigilar       cómo se detecta un cambio:
#                   metodo: git     → repo, y opcionalmente base (commit o etiqueta
#                                     desde la que contar commits), rutas,
#                                     etiquetas (patrón de las etiquetas de versión)
#                                     y vista (última etiqueta ya revisada, si se
#                                     sigue citando otra anterior)
#                   metodo: eurlex  → celex; revisión manual de las relaciones
#                                     del acto en EUR-Lex
#                   metodo: manual  → donde (URL) y que (qué mirar)
#   relaciones    lista de {tipo, a}: modifica | desarrolla | cita | perfila | usa
#                 Las citas acto → norma del inventario se añaden solas.
#   nota          lo que conviene saber al revisarla
#
# Tras revisar una fuente: actualizar `revisado` (y `citada`, `url` y `base` si
# cambió de versión), y revisar las fichas que muestra la página de impacto.

fuentes:

